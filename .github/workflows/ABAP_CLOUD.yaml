name: ABAP_CLOUD

on:
  push:

permissions:
  contents: read

concurrency:
  group: ABAP_CLOUD-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ABAP_CLOUD:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-node@v3
      with:
        node-version: '22'
    - run: npm ci
    - run: npx abaplint .github/abaplint/abap_cloud.jsonc
