name: auto_downport

on:
  push:
    branches: [main]

# pushes the downported source to the branch 702
permissions:
  contents: write

concurrency:
  group: auto_downport-${{ github.ref }}
  cancel-in-progress: true

jobs:
  auto_downport:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Checkout Repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '22'

    - run: npm ci
    - run: npm run downport

    - name: Run abaplint on downported code
      run: npx abaplint .github/abaplint/abap_702.jsonc

    - name: Push the downported source to the branch 702
      run: |
        git config user.name 'github-actions[bot]'
        git config user.email 'github-actions[bot]@users.noreply.github.com'
        git checkout -B 702
        git add src
        git diff --staged --quiet || git commit -m "Downport of $GITHUB_SHA to 7.02"
        git push --force origin 702
