name: test_rename

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: test_rename-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test_rename:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-node@v3
      with:
        node-version: '22'
    - run: npm ci
    - run: npm run rename_test
